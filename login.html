<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Log in</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://www.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:wght@400;500&family=Figtree:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
    <script>
      // Old links like login.html?tab=register now go to the register page
      if (new URLSearchParams(location.search).get("tab") === "register")
        location.replace("register.html" + location.search.replace(/[?&]tab=register/, "").replace(/^&/, "?"));
    </script>
  </head>
  <body>
    <nav id="nav"></nav>
    <section>
      <div class="wrap">
        <div class="auth">
          <div class="tabs">
            <button type="button" class="on">Log in</button
            ><button type="button" data-go="register.html">Register</button>
          </div>
          <form class="form one" id="log">
            <div>
              <label for="lu">Username</label
              ><input id="lu" autocomplete="username" required />
            </div>
            <div>
              <label for="lp">Password</label
              ><input
                id="lp"
                type="password"
                autocomplete="current-password"
                required
              />
            </div>
            <p class="err" id="lerr" role="alert"></p>
            <button class="btn">Log in</button>
          </form>
        </div>
      </div>
    </section>
    <script defer src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script defer src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
    <script defer src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <script defer src="js/firebase-config.js"></script>
    <script defer src="js/common.js"></script>
    <script defer src="js/login.js"></script>
  </body>
</html>
