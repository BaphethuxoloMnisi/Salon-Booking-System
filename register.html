<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Register</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://www.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:wght@400;500&family=Figtree:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <nav id="nav"></nav>
    <section>
      <div class="wrap">
        <div class="auth">
          <div class="tabs">
            <button type="button" data-go="login.html">Log in</button
            ><button type="button" class="on">Register</button>
          </div>
          <form class="form one" id="reg">
            <div>
              <label for="rn">Full name</label
              ><input id="rn" autocomplete="name" required />
            </div>
            <div>
              <label for="re">Email</label
              ><input id="re" type="email" autocomplete="email" required />
            </div>
            <div>
              <label for="rph">Phone</label
              ><input id="rph" type="tel" autocomplete="tel" required />
            </div>
            <div>
              <label for="ru">Username</label
              ><input id="ru" autocomplete="username" required />
            </div>
            <div>
              <label for="rp">Password</label
              ><input
                id="rp"
                type="password"
                autocomplete="new-password"
                required
              />
            </div>
            <div>
              <label for="rc">Confirm password</label
              ><input
                id="rc"
                type="password"
                autocomplete="new-password"
                required
              />
            </div>
            <p class="err" id="rerr" role="alert"></p>
            <button class="btn">Create account</button>
          </form>
        </div>
      </div>
    </section>
    <script defer src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script defer src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
    <script defer src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <script defer src="js/firebase-config.js"></script>
    <script defer src="js/common.js"></script>
    <script defer src="js/register.js"></script>
  </body>
</html>
